# Portão mínimo do site: um PR só entra se o lint e o build passarem. É o que o robô das
# tarefas (OpenProject) espera para fundir sozinho.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Num PR, um push novo cancela a verificação anterior. Em `main` não se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verificar:
    name: Instalar · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # O site não precisa de variáveis de ambiente para construir (confirmado
      # num clone limpo sem nenhuma). Sem segredos neste workflow.
      - run: npm run build
        env:
          CI: "true"
