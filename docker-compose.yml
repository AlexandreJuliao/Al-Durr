services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: al_durr_dev
    ports:
      - "3030:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - WATCHPACK_POLLING=true
    env_file:
      - .env.local
